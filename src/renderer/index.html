<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>termEd</title>
  <link rel="stylesheet" href="./renderer.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="ed-scrim"></div>

  <div id="ed-tabbar">
    <div id="ed-tablist" role="tablist"></div>
    <div id="ed-tabbar-actions">
      <button id="ed-new-tab" class="ed-tabbar-button" type="button" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
      </button>
      <button id="ed-tab-menu" class="ed-tabbar-button" type="button" title="Open a new tab menu" aria-label="Menu">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
      </button>
    </div>
  </div>

  <div id="ed-menu" class="hidden" role="menu">
    <button type="button" data-action="new-tab" role="menuitem">New tab<kbd>Ctrl+T</kbd></button>
    <button type="button" data-action="split-row" role="menuitem">Split right<kbd>Alt+Shift++</kbd></button>
    <button type="button" data-action="split-column" role="menuitem">Split down<kbd>Alt+Shift+-</kbd></button>
    <div class="ed-menu-sep"></div>
    <button type="button" data-action="settings" role="menuitem">Settings<kbd>Ctrl+,</kbd></button>
    <button type="button" data-action="about" role="menuitem">About termEd</button>
  </div>
  <!-- Each tab gets its own backdrop + bubble + terminal, appended here at
       runtime (see tab-manager.ts createSession) so Ed's wallpaper and
       popups are independent per tab. -->
  <div id="terminal-panes"></div>

  <div id="ed-about" class="hidden">
    <div id="ed-about-panel">
      <button id="ed-about-close" type="button" aria-label="Close">×</button>
      <img id="ed-about-icon" src="../../assets/icon.png" alt="" />
      <h1 id="ed-about-name">termEd</h1>
      <p id="ed-about-tagline">The terminal that believes in you.</p>
      <dl id="ed-about-meta">
        <dt>Version</dt>
        <dd id="ed-about-version"></dd>
        <dt>Commit</dt>
        <dd id="ed-about-commit"></dd>
      </dl>
      <p id="ed-about-credits">
        Made by Nate Shoffner ·
        <a id="ed-about-link" href="https://nateshoffner.com">nateshoffner.com</a>
      </p>
    </div>
  </div>

  <!-- Control names match Settings keys (src/settings.ts); see
       settings-panel.ts for how they're read and saved. -->
  <div id="ed-settings" class="hidden">
    <div id="ed-settings-panel" role="dialog" aria-labelledby="ed-settings-title" tabindex="-1">
      <button id="ed-settings-close" type="button" aria-label="Close">×</button>
      <h1 id="ed-settings-title">Settings</h1>
      <form id="ed-settings-form" autocomplete="off">
        <section class="ed-settings-section">
          <h2>Terminal</h2>
          <label class="ed-field">
            <span class="ed-field-label">Font family</span>
            <select name="fontFamily">
              <option value="">Default (Cascadia Mono)</option>
            </select>
          </label>
          <div id="ed-settings-font-preview" class="ed-font-preview">The quick brown fox 0O 1lI {} =&gt;</div>
          <label class="ed-check ed-field-indent">
            <input id="ed-settings-all-fonts" type="checkbox" />
            <span>Show all fonts, not just monospace</span>
          </label>
          <label class="ed-field">
            <span class="ed-field-label">Font size</span>
            <input name="fontSize" type="number" step="1" />
          </label>
          <p class="ed-field-hint">Also Ctrl+= and Ctrl+- in the terminal, Ctrl+0 to reset.</p>
          <label class="ed-field">
            <span class="ed-field-label">Cursor style</span>
            <select name="cursorStyle">
              <option value="block">Block</option>
              <option value="bar">Bar</option>
              <option value="underline">Underline</option>
            </select>
          </label>
        </section>

        <section class="ed-settings-section">
          <h2>Shell</h2>
          <label class="ed-field">
            <span class="ed-field-label">Default shell</span>
            <input name="shell" type="text" list="ed-shell-list" placeholder="Auto-detect" spellcheck="false" />
          </label>
          <datalist id="ed-shell-list"></datalist>
          <label class="ed-field">
            <span class="ed-field-label">Starting directory</span>
            <input name="startingDirectory" type="text" placeholder="Home folder" spellcheck="false" />
          </label>
          <p class="ed-field-hint">Shell settings apply to new tabs and panes.</p>
        </section>

        <section class="ed-settings-section">
          <h2>Ed</h2>
          <label class="ed-field">
            <span class="ed-field-label">Chattiness</span>
            <select name="edChattiness">
              <option value="quiet">Quiet</option>
              <option value="normal">Normal</option>
              <option value="chatty">Chatty</option>
            </select>
          </label>
        </section>

        <section class="ed-settings-section">
          <h2>Appearance</h2>
          <label class="ed-field">
            <span class="ed-field-label">Backdrop dim</span>
            <span class="ed-range">
              <input name="backdropDim" type="range" min="0" step="5" />
              <output id="ed-settings-dim-value"></output>
            </span>
          </label>
        </section>

        <section class="ed-settings-section">
          <h2>Window</h2>
          <label class="ed-check">
            <input name="rememberWindowBounds" type="checkbox" />
            <span>Remember window size and position</span>
          </label>
        </section>
      </form>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
